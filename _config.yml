# Prime Attack 법적 문서 사이트 (GitHub Pages)
# main 앱 저장소(prime_attack)가 이 저장소를 Pages 소스로 쓰므로
# 공개 URL은 https://nicejhkim.github.io/prime_attack/ 이다.
title: Prime Attack
description: Privacy policy and legal documents for Prime Attack
url: https://nicejhkim.github.io
baseurl: /prime_attack

markdown: kramdown
permalink: pretty

# 스토어 이미지·리스팅은 올리지 않는다.
# store/legal 원본 md는 include_relative 로 읽히며, raw .md 로도 복사된다.
exclude:
  - store/appstore
  - store/play
  - store/.DS_Store
  - README.md
  - .gitignore



defaults:
  - scope:
      path: "ko"
    values:
      lang: ko
      layout: default
  - scope:
      path: "en"
    values:
      lang: en
      layout: default
